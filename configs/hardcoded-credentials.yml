name: "Standard scan plus credential checks"

# Uncomment to run ONLY the credential queries listed under packs.
# Leave the optional queries setting below commented in that case.
# disable-default-queries: true

# Optional: explicitly select a standard suite (uncomment one).
# queries:
#   - uses: code-scanning      # Redundant while defaults are enabled.
#   - uses: security-extended  # Broader security coverage.

packs:
  csharp:
    - "codeql/csharp-queries:Security Features/CWE-798/HardcodedConnectionString.ql"
    - "codeql/csharp-queries:Security Features/CWE-798/HardcodedCredentials.ql"
    - codeql/csharp-queries:Configuration/PasswordInConfigurationFile.ql
    - githubsecuritylab/codeql-csharp-queries:security/CWE-798/HardcodedCredentialsSymmetricSecurityKey.ql
    - githubsecuritylab/codeql-csharp-queries:security/CWE-328/WeakPasswordHashing.ql
    - githubsecuritylab/codeql-csharp-queries:security/CWE-759/HashWithoutSalt.ql

  go:
    - codeql/go-queries:Security/CWE-798/HardcodedCredentials.ql

  java:
    - codeql/java-queries:Security/CWE/CWE-798/HardcodedCredentialsApiCall.ql
    - codeql/java-queries:experimental/Security/CWE/CWE-555/PasswordInConfigurationFile.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-798/HardcodedBase64Usage.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-798/HardcodedPasswordsInProperties.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-555/CredentialsInPropertiesFile.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-598/CredentialsInOutboundUrl.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-555/PasswordInConfigurationFile.ql
    - githubsecuritylab/codeql-java-queries:security/CWE-759/HashWithoutSalt.ql

  javascript:
    - codeql/javascript-queries:Security/CWE-798/HardcodedCredentials.ql
    - codeql/javascript-queries:Security/CWE-313/PasswordInConfigurationFile.ql

  python:
    - codeql/python-queries:Security/CWE-798/HardcodedCredentials.ql
    - githubsecuritylab/codeql-python-queries:security/CWE-798/HardcodedFrameworkSecrets.ql
    - githubsecuritylab/codeql-python-queries:security/CWE-1393/DefaultPasswordDB.ql
    - githubsecuritylab/codeql-python-queries:security/CWE-522/InsecurelyStoredPassword.ql

  ruby:
    - codeql/ruby-queries:queries/security/cwe-798/HardcodedCredentials.ql

  swift:
    - codeql/swift-queries:queries/Security/CWE-259/ConstantPassword.ql
    - codeql/swift-queries:queries/Security/CWE-321/HardcodedEncryptionKey.ql
